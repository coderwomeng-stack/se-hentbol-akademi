<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>S.E Hentbol Akademi</title>
 <style>
    .slogan {
  color: #ffb703;
  font-size: 1.8rem;
  font-weight: bold;
  font-style: italic;
  margin-bottom: 25px;
}
    body {
      background-color: #1b4332; /* Koyu Saha Yeşili */
      color: #ffffff;
      font-family: sans-serif;
      padding: 20px;
    }

    h1, h2 {
      color: #ffb703; /* Canlı Kulüp Sarısı */
    }

    a.btn {
      background-color: #ffb703 !important;
      color: black !important;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }

    /* Yana Kaydırma Alanı */
    .takim-kaydirma {
      display: flex;
      gap: 15px; /* Kartlar arası boşluk */
      overflow-x: auto; /* Sağa-sola kaydırma özelliği */
      padding-bottom: 15px; /* Alt kaydırma çubuğu için boşluk */
    }

    /* Tekil Takım Kartı */
    .takim-karti {
      min-width: 220px; /* Kartların genişliği */
      background-color: #0d2818; /* Kart zemin rengi */
      border: 2px solid #ffb703;   /* Sarı Çerçeve */
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      flex-shrink: 0; /* Kartların büzülmesini engeller */
    }

    .takim-karti img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .takim-karti h3 {
      color: #ffb703;
      margin: 10px 0 5px 0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <h1>S.E.H.A</h1>
  
  <a class="btn" href="https://www.instagram.com/sinanebrar.hentbol.akademi/" target="_blank">Instagram Hesabımız</a>
  <p class="slogan">"Tutkuyla Başlar, Disiplinle Yükselir!"</p>

  <h2>Takımlarımız</h2>

  <!-- Yana Kaydırmalı Kartlar Alanı -->
  <div class="takim-kaydirma">
    
    <div class="takim-karti">
      <img src="https://picsum.photos/300/200?random=1" alt="Kadınlar 2. Lig">
      <h3>Kadınlar 2. Lig</h3>
    </div>

    <div class="takim-karti">
      <img src="https://picsum.photos/300/200?random=2" alt="Genç Kızlar">
      <h3>Genç Kızlar</h3>
    </div>

    <div class="takim-karti">
      <img src="https://picsum.photos/300/200?random=3" alt="Yıldız Kızlar">
      <h3>Yıldız Kızlar</h3>
    </div>

    <div class="takim-karti">
      <img src="https://picsum.photos/300/200?random=4" alt="Küçük Kızlar">
      <h3>Küçük Kızlar</h3>
    </div>

    <div class="takim-karti">
      <img src="https://picsum.photos/300/200?random=5" alt="Minik Kızlar">
      <h3>Minik Kızlar</h3>
    </div>

  </div>

</body>
</html>
